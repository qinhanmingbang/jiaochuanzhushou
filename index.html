<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>交传助手</title>
<style>
:root{--bg:#eef2f9;--c:#fff;--t:#1c2333;--m:#6f7a8f;--p:#3b6cf5;--no:#e0454f;--b:#e3e8f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--c:#1a2030;--t:#e8ecf4;--m:#97a3b8;--p:#6f95ff;--no:#f4777f;--b:#2a3347}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 -apple-system,"PingFang SC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:800px;margin:0 auto;padding:10px}.card{background:var(--c);border-radius:16px;padding:12px;margin:10px 0}
button,select{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:10px 14px}
.pri{background:var(--p);color:#fff;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.seg .on{background:var(--p);color:#fff}
#mic{width:100%;font-size:20px;padding:16px;margin:8px 0}#mic.rec{background:var(--no);animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.7}}
textarea,#out{width:100%;min-height:150px;border:1px solid var(--b);border-radius:12px;padding:10px;background:var(--bg);color:var(--t);font:inherit;font-size:var(--fs,22px);line-height:1.5;white-space:pre-wrap}
.m{color:var(--m);font-size:13px}
</style></head><body><main>
<div class="card"><b>交传助手（手机/电脑通用）</b>
<p class="m" style="margin:4px 0">首次使用请联网点「下载离线模型」（约 200–300MB，Wi-Fi 下进行）。下载完成后可断网使用。</p>
<div class="row"><button class="pri" onclick="pre()">下载离线模型</button>
<select id="eng"><option value="w">离线识别（Whisper，断网可用）</option><option value="s">系统听写（快，可能联网）</option></select></div>
<div id="st" class="m" style="margin-top:6px">就绪</div></div>
<div class="card"><div class="row seg"><button id="s_en" class="on" onclick="setL('en')">对方说英文</button><button id="s_zh" onclick="setL('zh')">对方说中文</button></div>
<button id="mic" class="pri" onclick="toggle()">🎤 点一下开始录音</button>
<textarea id="src" placeholder="识别出的文字显示在这里，可直接修改…"></textarea>
<div class="row" style="margin-top:8px"><button class="pri" onclick="tr()" style="font-size:18px">翻译</button><button onclick="clr()">清空</button><button onclick="fs(4)">A+</button><button onclick="fs(-4)">A−</button></div></div>
<div class="card"><b>译文</b><div id="out" style="margin-top:6px"></div></div>
<p class="m">提示：iPhone 请用 Safari 打开，点分享按钮 →「添加到主屏幕」，再从主屏幕图标打开，离线数据更不容易被系统清掉。</p></main>
<script type="module">
import {pipeline,env} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
env.allowLocalModels=false;
const $=id=>document.getElementById(id),TL={en:'zh',zh:'en'},NM={asr:'识别模型',en:'英译中模型',zh:'中译英模型'};
const MODEL={asr:'Xenova/whisper-base',en:'Xenova/opus-mt-en-zh',zh:'Xenova/opus-mt-zh-en'};
let L='en',P={},rc=null,stream=null,chunks=[],sr=null,want=false,base='',size=22;
const say=t=>$('st').textContent=t;
window.setL=l=>{if(rc||sr)toggle();L=l;$('s_en').className=l=='en'?'on':'';$('s_zh').className=l=='zh'?'on':''};
window.fs=d=>{size=Math.max(14,size+d);document.documentElement.style.setProperty('--fs',size+'px')};
window.clr=()=>{$('src').value='';$('out').textContent=''};
function load(k){return P[k]||(P[k]=pipeline(k=='asr'?'automatic-speech-recognition':'translation',MODEL[k],{progress_callback:p=>{if(p.status=='progress')say(`加载${NM[k]}：${String(p.file).split('/').pop()} ${Math.round(p.progress)}%`)}}).catch(e=>{delete P[k];throw e}))}
window.pre=async()=>{try{for(const k of['asr','en','zh']){const m=await load(k);if(m.dispose)await m.dispose();delete P[k]}say('✅ 三个模型都已下载，之后可断网使用')}catch(e){say('下载失败：'+e.message+'（请确认已联网）')}};
const btn=on=>{$('mic').className='pri'+(on?' rec':'');$('mic').textContent=on?'⏹ 点一下结束并识别':'🎤 点一下开始录音'};
async function f32(blob){const AC=window.AudioContext||window.webkitAudioContext,c=new AC(),b=await c.decodeAudioData(await blob.arrayBuffer());c.close();
 const o=new OfflineAudioContext(1,Math.ceil(b.duration*16000),16000),s=o.createBufferSource();s.buffer=b;s.connect(o.destination);s.start();return (await o.startRendering()).getChannelData(0)}
window.toggle=async()=>{
 if($('eng').value=='s')return sys();
 if(rc){rc.stop();return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return say('无法使用麦克风：'+e.message)}
 chunks=[];rc=new MediaRecorder(stream);rc.ondataavailable=e=>chunks.push(e.data);
 rc.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:rc.mimeType});rc=null;btn(false);await asr(b)};
 rc.start();btn(true);say('录音中…')};
async function asr(blob){const t0=performance.now();try{say('识别中…');const a=await f32(blob),m=await load('asr');
 const r=await m(a,{language:L=='en'?'english':'chinese',task:'transcribe',chunk_length_s:30,stride_length_s:5});
 const s=$('src');s.value+=(s.value&&!/\s$/.test(s.value)?' ':'')+r.text.trim();say(`识别完成，用时 ${((performance.now()-t0)/1000).toFixed(1)} 秒`)}catch(e){say('识别失败：'+e.message)}}
function sys(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return say('此浏览器不支持系统听写');
 if(want){want=false;sr&&sr.stop();btn(false);return}
 want=true;base=$('src').value;if(base&&!/\s$/.test(base)&&L=='en')base+=' ';
 const go=()=>{sr=new SR();sr.lang=L=='en'?'en-US':'zh-CN';sr.continuous=true;sr.interimResults=true;
  sr.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)base+=t+(L=='en'?' ':'');else it+=t}$('src').value=base+it};
  sr.onerror=e=>say('听写出错：'+e.error);sr.onend=()=>{if(want)try{go()}catch(e){}};sr.start()};
 go();btn(true);say('系统听写中（可能联网）')}
window.tr=async()=>{const s=$('src').value.trim();if(!s)return;const t0=performance.now(),o=$('out');o.textContent='';
 try{let T=null;if('Translator' in self){try{T=await Translator.create({sourceLanguage:L,targetLanguage:TL[L]})}catch(e){}}
  const m=T?null:await load(L),parts=s.match(/[^.!?。！？\n]+[.!?。！？]*/g)||[s];
  for(const p of parts){const x=T?await T.translate(p.trim()):(await m(p.trim()))[0].translation_text;o.textContent+=(o.textContent?'\n':'')+x}
  say(`翻译完成，用时 ${((performance.now()-t0)/1000).toFixed(1)} 秒`)}catch(e){say('翻译失败：'+e.message)}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
